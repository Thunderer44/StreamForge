<!DOCTYPE html>
<html>
<head>
    <title>StreamForge WebRTC Viewer</title>
    <style>
        body { margin: 0; padding: 20px; background: #1a1a1a; font-family: Arial; color: #fff; }
        #status { margin-bottom: 10px; font-size: 14px; }
        video { border: 2px solid #5865F2; max-width: 100%; display: block; background: #000; }
    </style>
</head>
<body>
    <div id="status">Connecting to localhost:8080...</div>
    <video id="video" autoplay playsinline></video>
    
    <script>
        const video = document.getElementById('video');
        const status = document.getElementById('status');
        
        const ws = new WebSocket('ws://localhost:8080');
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
        });
        
        pc.ontrack = (event) => {
            video.srcObject = event.streams[0];
            status.textContent = 'Receiving stream!';
        };
        
        pc.onicecandidate = (event) => {
            if (event.candidate) {
                ws.send(JSON.stringify({
                    type: 'candidate',
                    candidate: event.candidate.candidate,
                    sdpMid: event.candidate.sdpMid,
                    sdpMLineIndex: event.candidate.sdpMLineIndex
                }));
            }
        };
        
        ws.onopen = () => {
            status.textContent = 'Connected! Waiting for stream...';
        };
        
        ws.onmessage = async (event) => {
            const msg = JSON.parse(event.data);
            
            if (msg.type === 'offer') {
                await pc.setRemoteDescription({ type: 'offer', sdp: msg.sdp });
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                ws.send(JSON.stringify({ type: 'answer', sdp: answer.sdp }));
            } else if (msg.type === 'candidate') {
                await pc.addIceCandidate({
                    candidate: msg.candidate,
                    sdpMid: msg.sdpMid,
                    sdpMLineIndex: msg.sdpMLineIndex
                });
            }
        };
        
        ws.onerror = () => status.textContent = 'Connection error';
        ws.onclose = () => status.textContent = 'Disconnected';
    </script>
</body>
</html>
